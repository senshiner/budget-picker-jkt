<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="index.html">Budget Picker JKT</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span>Menu</span><span class="menu-lines" aria-hidden="true"></span>
      </button>
      <nav class="main-nav" id="main-nav" aria-label="Navigasi utama">
        <ul class="nav-list">

    <section class="page active" id="jelajah" aria-labelledby="jelajah-title">
